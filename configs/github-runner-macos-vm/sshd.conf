# SSH into the macOS runner VM: only admin, only with a key (the host's
# provisioning key). The VM shares the host's virtual network with the Colima
# VM that runs Linux CI jobs, and the image's admin password is public.
#
# The host's provisioner (configs/github-runner-macos-vm/provision.sh) writes
# this file as soon as it can log in, before Nix is installed; afterwards the
# VM's nix-darwin system manages it with the same content. sshd uses the first
# value it reads for each keyword, and this file comes before macOS' own
# 100-macos.conf.
AllowUsers admin
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
